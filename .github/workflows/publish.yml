name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}" >&2
            exit 1
          fi
      # Trusted publishing needs npm CLI 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # prepack rebuilds dist/ before publishing
      # Authenticated through the npm trusted publisher for GenderAPI/genderapi-js (publish.yml); no token is stored.
      - run: npm publish --access public --provenance
